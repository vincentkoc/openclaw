name: PR 125271 macOS proof

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Repository containing the exact commit to test
        required: true
        type: string
      target_sha:
        description: Full commit SHA to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Verify source identity
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Run configured-port regression
        run: OPENCLAW_GATEWAY_PORT=54321 swift test --package-path apps/macos --filter GatewayProcessManagerTests
