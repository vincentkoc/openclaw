name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  pr-130448-cli-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 42e84443a2e79c5ff002aff1b6c6735e8e996ed9
      PR_SHA: 1ef98b97943de52e233268d3312259778994ce8f
      PNPM_VERSION: 11.22.0
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Fetch immutable source trees
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/baseline"
          git -C "$RUNNER_TEMP/baseline" fetch --depth=1 \
            https://github.com/openclaw/openclaw.git "$BASE_SHA"
          git -C "$RUNNER_TEMP/baseline" checkout --detach FETCH_HEAD

          git init "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" fetch --depth=1 \
            https://github.com/ruel225/openclaw.git "$PR_SHA"
          git -C "$RUNNER_TEMP/candidate" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/candidate" remote add upstream \
            https://github.com/openclaw/openclaw.git
          git -C "$RUNNER_TEMP/candidate" fetch --depth=100 upstream main

          test "$(git -C "$RUNNER_TEMP/baseline" rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/candidate" rev-parse HEAD)" = "$PR_SHA"
          printf 'baseline_sha=%s\ncandidate_sha=%s\n' "$BASE_SHA" "$PR_SHA"

      - name: Install and build both revisions
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          for tree in baseline candidate; do
            (
              cd "$RUNNER_TEMP/$tree"
              pnpm install --frozen-lockfile
              pnpm build
            )
          done

      - name: Prove CLI behavior without network access
        shell: bash
        run: |
          set -euo pipefail

          sudo unshare -n -- bash -c '
            test -z "$(ip route show)"
            printf "network_namespace_routes=none\n"
          '

          run_case() {
            local tree="$1"
            local case_name="$2"
            local expected_exit="$3"
            local expected_text="$4"
            local rejected_text="$5"
            shift 5

            local state="$RUNNER_TEMP/state-$case_name"
            local home="$RUNNER_TEMP/home-$case_name"
            mkdir -p "$state" "$home"
            printf '{"models":{"catalogRefresh":{"enabled":false}}}\n' \
              >"$state/openclaw.json"

            set +e
            output="$(
              cd "$RUNNER_TEMP/$tree" &&
                sudo unshare -n -- env \
                  HOME="$home" \
                  OPENCLAW_STATE_DIR="$state" \
                  OPENCLAW_CONFIG_PATH="$state/openclaw.json" \
                  CI=1 \
                  node openclaw.mjs "$@" 2>&1
            )"
            exit_code=$?
            set -e

            printf '\n=== %s ===\nexit=%s\n%s\n' \
              "$case_name" "$exit_code" "$output"
            test "$exit_code" -eq "$expected_exit"
            grep -F -- "$expected_text" <<<"$output"
            if [[ -n "$rejected_text" ]]; then
              ! grep -F -- "$rejected_text" <<<"$output"
            fi
          }

          run_case baseline baseline-parent-agent 0 \
            "Remote catalog refresh is disabled" "" \
            models --agent proof refresh
          run_case candidate candidate-parent-agent 1 \
            "models refresh does not support --agent" \
            "Remote catalog refresh is disabled" \
            models --agent proof refresh
          run_case candidate candidate-leaf-agent 1 \
            "unknown option '--agent'" "" \
            models refresh --agent proof
          run_case candidate candidate-unscoped 0 \
            "Remote catalog refresh is disabled" "" \
            models refresh

      - name: Run focused tests and changed-path gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          node scripts/run-vitest.mjs \
            src/cli/models-cli.test.ts \
            src/commands/models/refresh.test.ts
          node scripts/check-changed.mjs -- \
            src/cli/models-cli.ts \
            src/cli/models-cli.runtime.ts \
            src/cli/models-cli.test.ts \
            docs/cli/models.md
          merge_base="$(git merge-base HEAD refs/remotes/upstream/main)"
          git diff --check "$merge_base..HEAD"
          git diff --numstat "$merge_base..HEAD" -- \
            src/cli/models-cli.ts \
            src/cli/models-cli.runtime.ts \
            src/cli/models-cli.test.ts \
            docs/cli/models.md
